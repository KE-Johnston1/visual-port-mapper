<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recruiter Demo — Visual Port Mapper</title>
<style>
body{margin:0;background:#0b1020;color:#edf2fb;font:16px/1.55 system-ui,sans-serif}.wrap{max-width:900px;margin:auto;padding:32px}.card{background:#121a2d;border:1px solid #2b3a59;border-radius:16px;padding:24px;margin:16px 0}h1{margin-bottom:4px}.muted{color:#a6b2c8}.step{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#67b7ff}.evidence{background:#0a1221;border-radius:10px;padding:16px;margin:12px 0;white-space:pre-wrap}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.actions button{background:#182640;color:#edf2fb;border:1px solid #67b7ff;border-radius:9px;padding:13px 18px;cursor:pointer;font-weight:700;font-size:15px}.actions button:hover,.actions button:focus{background:#22365b;outline:2px solid #67b7ff}.progress{height:10px;background:#263452;border-radius:99px;overflow:hidden}.progress span{display:block;height:100%;background:#67b7ff;width:0;transition:width .2s}.decision{border-left:4px solid #67b7ff;padding-left:14px}.hidden{display:none}.stage-list{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px}.stage-dot{padding:6px 10px;border:1px solid #405276;border-radius:99px;font-size:12px}.stage-dot.active{border-color:#67b7ff;font-weight:700}.stage-dot.done{opacity:.65}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
<div class="step">Recruiter demo</div>
<h1>Watch an investigation unfold</h1>
<p class="muted">A short, guided example of how a network observation becomes an evidence-based decision. No real systems are contacted; all evidence is synthetic.</p>
<div class="progress"><span id="bar"></span></div>
<p id="progressText" class="muted"></p>
<div id="stageList" class="stage-list" aria-label="Investigation stages"></div>
</div>
<div class="card" id="investigationCard">
<div class="step" id="step"></div>
<h2 id="title"></h2>
<p id="body"></p>
<div id="evidence" class="evidence"></div>
<div id="actions" class="actions"></div>
</div>
<div class="card hidden" id="trailCard">
<div class="step">Decision trail</div>
<div id="trail"></div>
</div>
<script>
const steps=[
{step:'1 / 6',title:'Initial observation',body:'A synthetic network discovery identifies TCP/22 on WEB-02. SSH is not currently listed in the documented service baseline.',evidence:'Asset: WEB-02\nIP: 10.10.10.25\nCriticality: Medium\nObserved: 22/tcp SSH, 80/tcp HTTP, 443/tcp HTTPS',action:'Review context'},
{step:'2 / 6',title:'Establish context',body:'Before deciding whether the exposure is malicious, establish who owns the asset and what it is used for.',evidence:'Owner: Web Operations\nRole: Internal web server\nHTTP/HTTPS: expected\nSSH: not documented in baseline',action:'Check authorisation'},
{step:'3 / 6',title:'A legitimate explanation appears',body:'The asset owner says administrators normally use SSH to maintain web servers. This is useful evidence, but it is not yet independent verification.',evidence:'Owner statement: “Administrators normally use SSH for maintenance.”',action:'Request verification evidence'},
{step:'4 / 6',title:'Verify the explanation',body:'The analyst checks evidence that can independently support the claim.',evidence:'Change record: SSH administration approved for WEB-02\nSource IP: 10.10.10.15\nSource network: authorised administration segment\nSSH authentication: successful administrator login\nMaintenance window: active',action:'Correlate evidence'},
{step:'5 / 6',title:'Correlate before closing',body:'The observed service, source, authentication and change record now agree with the owner explanation. There is no need to label the original observation an attack.',evidence:'✓ Service authorised\n✓ Source authorised\n✓ Authentication consistent\n✓ Change record verified\n✓ Activity occurred during approved maintenance',action:'Make final assessment'},
{step:'6 / 6',title:'Final analyst decision',body:'The evidence supports an authorised administrative service. The analyst documents the reasoning and closes according to the organisation playbook.',evidence:'FINAL ASSESSMENT: EXPECTED\n\nRationale: SSH was initially outside the documented baseline. Independent evidence confirmed authorised administrative use during an approved maintenance window.',action:'Finish investigation'}
];
let i=0;const trail=[];
function render(){
 const s=steps[i];
 document.getElementById('step').textContent=s.step;
 document.getElementById('title').textContent=s.title;
 document.getElementById('body').textContent=s.body;
 document.getElementById('evidence').textContent=s.evidence;
 const actions=document.getElementById('actions');
 actions.innerHTML='';
 const button=document.createElement('button');
 button.type='button';button.textContent=s.action;button.setAttribute('aria-label',s.action);
 button.onclick=advance;actions.appendChild(button);
 document.getElementById('bar').style.width=((i+1)/steps.length*100)+'%';
 document.getElementById('progressText').textContent=`Stage ${i+1} of ${steps.length} — use the button below to continue.`;
 document.getElementById('stageList').innerHTML=steps.map((x,n)=>`<span class="stage-dot ${n===i?'active':''} ${n<i?'done':''}">${n+1}</span>`).join('');
}
function advance(){
 trail.push([steps[i].title,steps[i].action]);
 if(i===steps.length-1){renderTrail();return;}
 i++;render();window.scrollTo({top:0,behavior:'smooth'});
}
function renderTrail(){
 document.getElementById('progressText').textContent='Investigation complete — 6 of 6 stages completed.';
 document.getElementById('bar').style.width='100%';
 document.getElementById('stageList').innerHTML=steps.map((x,n)=>`<span class="stage-dot done">${n+1} ✓</span>`).join('');
 document.getElementById('investigationCard').classList.add('hidden');
 document.getElementById('trailCard').classList.remove('hidden');
 document.getElementById('trail').innerHTML=trail.map((x,n)=>`<p><strong>${n+1}. ${x[0]}</strong><br><span class="muted">Action: ${x[1]}</span></p>`).join('')+`<div class="decision"><strong>Outcome: Expected — verified and documented.</strong><p class="muted">The demonstration intentionally shows that a legitimate explanation is verified before closure.</p></div><div class="actions"><button type="button" onclick="location.reload()">Replay investigation</button></div>`;
}
render();
</script>
</div>
</body>
</html>
